name: Charbel events verification
on:
  push:
    branches: [feature/charbel-events-api]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build, unit tests and lint
        run: bash gradlew --no-daemon --console=plain testDebugUnitTest assembleDebug lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/run-live-device-checks.sh
      - name: Upload APK and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charbel-events-apk-and-test-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/outputs/androidTest-results/
            evidence/
